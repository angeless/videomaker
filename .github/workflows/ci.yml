name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python3 -c "
          import py_compile, sys, os
          errors = []
          for root_dir in ['modules', 'apps', 'tests']:
              for dirpath, dirnames, filenames in os.walk(root_dir):
                  dirnames[:] = [d for d in dirnames if d not in ('legacy_lab', '__pycache__')]
                  for f in filenames:
                      if f.endswith('.py'):
                          path = os.path.join(dirpath, f)
                          try:
                              py_compile.compile(path, doraise=True)
                          except py_compile.PyCompileError as e:
                              errors.append(str(e))
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All Python files pass syntax check')
          "

      - name: Run tests
        run: python3 -m pytest tests/ -v --tb=short

      - name: Critical files check
        run: |
          for f in VERSION CHANGELOG.md requirements.txt; do
            test -f "$f" || (echo "MISSING: $f" && exit 1)
          done
          echo "All critical files present"

      - name: Tech specs check
        run: |
          for f in docs/tech-specs/architecture.md \
                   docs/tech-specs/dev-governance.md \
                   docs/tech-specs/coding-standards.md \
                   docs/tech-specs/testing-strategy.md; do
            test -f "$f" || (echo "MISSING: $f" && exit 1)
          done
          echo "All tech specs present"
